name: daily-build

# 每日构建:夜间定时 + 手动可触发。产物走 artifact(保留 14 天),
# 不打 tag、不发 release——发布是显式动作,不归机器管。
# 产物名即安装器的坐标:luna-nightly-<os>-<arch> 内含裸二进制,
# install.sh / install.ps1 按 OS+uname -m 组名下载。
on:
  schedule:
    # 21:13 UTC ≈ 北京时间次日 05:13,错开整点高峰
    - cron: "13 21 * * *"
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  nightly:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    # Windows 是首飞试运行:源码还有未打 Windows 守卫的 POSIX 面
    # (getpid/kill/zlib 系统库),红了不拖垮夜间绿,待移植落定再转正
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: luna-nightly-linux-x86_64
            binary: luna
            experimental: false
          - os: ubuntu-24.04-arm
            artifact: luna-nightly-linux-aarch64
            binary: luna
            experimental: false
          # macOS 构建已通,但运行期测试 11/16(cli/rocks 的 GNU timeout
          # 缺席、loop 的 /tmp→/private/tmp 语义、linedit forkpty、serve
          # 监听重建)——平台移植待办已登记 todo.md,转正前按试运行带
          # 产物(Test 步 continue-on-error,Stage 照常出 artifact)
          - os: macos-latest
            artifact: luna-nightly-macos-aarch64
            binary: luna
            experimental: true
          - os: windows-latest
            artifact: luna-nightly-windows-x86_64
            binary: luna.exe
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build -j"$(nproc)"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release -j

      # 试运行腿(Windows/macOS)的测试红不拦 Stage:产物要出,失败记在
      # 步骤图标里,转正后关掉
      - name: Test
        if: runner.os != 'Windows'
        working-directory: build
        continue-on-error: ${{ matrix.experimental }}
        run: ctest -C $BUILD_TYPE --output-on-failure

      - name: Smoke
        if: runner.os != 'Windows'
        run: ./build/luna --version

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/luna.exe --version

      # 二进制 + luna_modules 侧车树进 artifact(zip 一层,装机侧只解
      # zip):二进制的模块查找先是编译期目录(只在构建机上存在),再落
      # 可执行文件同级 luna_modules/——产物不带侧车,装到任何机器都会
      # module 'argparse' not found(2026-10-02 实测踩中)。可执行位由
      # 安装脚本 chmod 补,zip 是否带着都无所谓
      - name: Stage
        shell: bash
        run: |
          mkdir stage
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/luna.exe stage/
          else
            cp build/luna stage/
          fi
          cp -r build/luna_modules stage/luna_modules

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/
          retention-days: 14
